[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-tradingview-server"
version = "0.1.0"
description = "MCP server for TradingView indicators using tradingview_scraper"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
dependencies = [
    "fastmcp>=2.0.0",
    "setuptools>=70.0.0",
    "tradingview-scraper>=0.4.8",
    "uvicorn[standard]>=0.29.0",
]

[project.scripts]
mcp-tradingview = "tradingview_server:main"

[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build.targets.wheel.force-include]
"tradingview_server.py" = "tradingview_server.py"

[tool.hatch.build.targets.sdist.force-include]
"tradingview_server.py" = "tradingview_server.py"

[tool.uv]
dev-dependencies = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0"]
